<title>內部控管</title>
<style>
:root{--paper:#f7f3ea;--panel:#fffdf8;--line:#ded3bd;--line2:#cbbfa4;
 --ink:#2b2721;--ink2:#5b5346;--gold:#8a6a25;--red:#9a3f2f}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);
 font:20px/2 "Noto Sans TC","PingFang TC",system-ui,sans-serif;
 min-height:100vh;display:flex;align-items:center;justify-content:center;padding:26px}
.box{width:100%;max-width:430px;text-align:center}
.mk{color:var(--gold);letter-spacing:.42em;font-size:15px;margin-bottom:28px}
h1{font-size:25px;letter-spacing:.1em;margin-bottom:12px;font-weight:700;line-height:1.6}
.d{color:var(--ink2);font-size:18px;margin-bottom:28px;line-height:1.9}
input{width:100%;background:var(--panel);border:2px solid var(--line2);color:var(--ink);
 padding:16px 18px;border-radius:11px;font:inherit;font-size:20px;text-align:center;letter-spacing:.08em}
input:focus{outline:none;border-color:var(--gold)}
button{width:100%;margin-top:13px;background:var(--gold);color:#fffdf8;border:0;
 padding:16px;border-radius:11px;font:inherit;font-size:19px;font-weight:700;letter-spacing:.2em;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.m{min-height:28px;margin-top:15px;font-size:17px;color:var(--ink2)}
.m.err{color:var(--red);font-weight:600}
.f{margin-top:34px;color:#8b8373;font-size:15px;line-height:1.9}
</style></head><body>

  </form>
