<title>內部控管</title>
<style>
:root{--bg:#10151c;--pan:#19202a;--line:#2d3947;--tx:#dfe6ee;--dim:#8d9cad;--gold:#c8a560;--red:#c2705c}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font:16px/1.8 "Noto Sans TC","PingFang TC",system-ui,sans-serif;
 min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{width:100%;max-width:380px;text-align:center}
.mk{color:var(--gold);letter-spacing:.42em;font-size:12px;margin-bottom:26px}
h1{font-size:18px;letter-spacing:.16em;margin-bottom:8px;font-weight:600}
.d{color:var(--dim);font-size:13.5px;margin-bottom:26px;line-height:1.85}
input{width:100%;background:var(--pan);border:1px solid var(--line);color:var(--tx);
 padding:13px 16px;border-radius:9px;font:inherit;font-size:16px;text-align:center;letter-spacing:.1em}
input:focus{outline:none;border-color:var(--gold)}
button{width:100%;margin-top:11px;background:var(--gold);color:#17202b;border:0;
 padding:13px;border-radius:9px;font:inherit;font-size:15px;font-weight:700;letter-spacing:.2em;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.m{min-height:22px;margin-top:13px;font-size:13.5px;color:var(--dim)}
.m.err{color:var(--red)}
.f{margin-top:30px;color:#5d6b7a;font-size:12px;line-height:1.9}
</style></head><body>
<div class="box">
